openapi: 3.0.3
info:
  title: Ecommerce API
  version: 1.0.0

paths:
  /orders:
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
    get:
      summary: List all orders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      summary: Get order by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int32
          required: true
          description: Order ID
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /orders/{id}/paid:
    post:
      summary: Mark order as paid
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Order ID
      responses:
        '200':
          description: Order marked as paid
        '404':
          description: Order not found

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - currency
        - items
      properties:
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItem'

    CreateOrderItem:
      type: object
      required:
        - product_id
        - quantity
        - price
      properties:
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        price:
          type: integer
          format: int64

    CreateOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
    Order:
      type: object
      required:
        - id
        - status
        - amount
        - currency
        - created_at
        - updated_at
        - items
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        amount:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        cancelled_at:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      required:
        - id
        - product_id
        - quantity
        - price
      properties:
        id:
          type: integer
          format: int32
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        price:
          type: integer
          format: int64